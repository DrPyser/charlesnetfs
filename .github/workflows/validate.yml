name: "validate"
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install fuse
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - run: nix develop .#github --command make check
    - run: nix develop .#github --command make test
