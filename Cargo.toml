[package]
name = "charlesnetfs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "charlesnetfs"
path = "src/main.rs"

[[bin]]
name = "journal"
path = "src/journal_bin.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fuse = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
ninep = { git = "https://github.com/sminez/ad.git", branch = "develop" }
signal-hook = "0.4"
ureq = { version = "2", features = ["json"] }
log = "0.4"
env_logger = "0.11"

