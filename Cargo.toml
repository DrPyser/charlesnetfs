[package]
name = "charlesnetfs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "charlesnetfs"
path = "src/bin/charlesnetfs.rs"

[[bin]]
name = "journal"
path = "src/bin/journal.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fuse = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
# TODO: migrate to new ninep crate split out from ad; its 0.6 has breaking API changes
ninep = { git = "https://github.com/sminez/ad.git", rev = "22d55f3845d62e5679df8711e9a1eee70f46ac88" }
# ninep = { version = "0.6" }
# Pin simple_coro to 0.1.3;
# ninep rev 22d55f3 (committed 2026-04-10) only works with simple_coro <= 0.1.3.
simple_coro = "=0.1.3"
ureq = { version = "2", features = ["json"] }
log = "0.4"
env_logger = "0.11"
styx9p = "0.1.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]

